{% extends "base.html" %}

{% block content %}
{% load crispy_forms_tags %}
<div class='row'>
    {% include "dashboard/sidebar.html" %}
   
  <div class='col-md-8'>
    <h4>Edit User Info</h4>
    <form action="{% url 'edit_user' form.instance.id %}" method='POST' >
    {% csrf_token %}
    {{ form | crispy }}
    <button type='submit' class='btn btn-warning'>Submit</button>
    </form>
  </div>
</div>
{% endblock %}
